[project]
name = "wick"
version = "0.1.0"
description = "WICK: backtester de cripto local, honesto y open source"
authors = [
    { name = "IFRAN-Ignacio", email = "ifran.videla.ignacio00@gmail.com" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "platformdirs>=4.14.4",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.2",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes y signos

[tool.mypy]
python_version = "3.12"
files = ["src/wick"]
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["wick.engine.*", "wick.data.*"]
strict = true

[[tool.mypy.overrides]]
module = ["numba.*", "pandas.*", "pyarrow.*", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: necesita internet (Binance real)"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
